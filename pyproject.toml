[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemmajev"
version = "0.1.0"
description = "Local decision probabilities with Gemma 4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "docs/licenses/*.txt"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow==25.0.1"]

[project.scripts]
gemmajev = "gemmajev.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemmajev"]

[tool.hatch.build.targets.wheel.force-include]
"configs/benchmarks" = "gemmajev/benchmarks/configs"
"docs/results" = "gemmajev/benchmarks/results"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/native", "/scripts", "/tests", "/configs", "/docs",
    "/LICENSE", "/README.md", "/pyproject.toml", "/uv.lock",
    "/.python-version", "/.gitignore", "/.gitattributes",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
